name: Ninjacart
description: 'Ninjacart is India''s largest agritech B2B fresh-produce supply-chain
  company, founded in 2015 and headquartered in Bengaluru. It connects farmers and
  producers directly with retailers, kirana stores, and businesses, removing layers
  of middlemen from the fruit-and-vegetable supply chain. Its product portfolio spans
  Ninja Mandi (wholesale produce marketplace), Ninja Kisan (farmer sourcing), Ninja
  Kirana (retailer supply), and Ninja Global, alongside a technology-licensing model,
  Ninja Tech Ventures, and a Startup Program that gives FoodTech/AgTech startups access
  to its supply-chain tooling (demand forecasting, pricing intelligence, procurement,
  inventory, logistics, and catalog management). Ninjacart is backed by investors
  including Accel, Tiger Global, and Walmart/Flipkart. As of this profile it exposes
  no public self-serve developer API or documentation; technology access is handled
  through partnerships (partnerships@ninjacart.com).'
